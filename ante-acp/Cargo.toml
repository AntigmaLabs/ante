[package]
name = "ante-acp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Agent Client Protocol support for Ante"
license = "Apache-2.0"
documentation = "https://docs.rs/ante-acp"
homepage = "https://antigma.ai"
repository = "https://github.com/AntigmaLabs/ante"

[dependencies]
agent-client-protocol = "2.2"
ante-sdk = { version = "0.2", default-features = false }
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"
tokio = { version = "1.52", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
