name: Harbor Test

on:
  workflow_dispatch:
    inputs:
      install_args:
        description: 'install.sh args for the Ante build to test (e.g. stable, nightly, a version); empty = install.sh default'
        required: false
        default: ''
      harbor_args:
        description: 'Arguments to pass to harbor'
        required: true
        default: '--dataset terminal-bench@2.0 --n-attempts 5'
      model_name:
        description: 'Model name to use'
        required: false
        default: 'gemini-3-pro-preview'
      provider:
        description: 'Model provider (anthropic, openai, gemini, etc.)'
        required: false
        default: 'gemini'
      effort:
        description: 'Reasoning effort passed to ante --effort'
        required: false
        default: ''
      model_base_url:
        description: 'Base URL for model API'
        required: false
        default: 'https://generativelanguage.googleapis.com/v1beta'
      model_temperature:
        description: 'Model temperature'
        required: false
        default: ''
      model_max_tokens:
        description: 'Max tokens for model'
        required: false
        default: ''
      runs_on:
        description: 'Runner to use for the test job'
        required: false
        default: 'gcp-hosted'
      run_count:
        description: 'Number of times to run Harbor tests (each run is a separate job with 6h limit)'
        required: false
        default: '1'

jobs:
  # First job: Generate matrix based on run_count
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Display all workflow inputs
        run: |
          echo "=========================================="
          echo "         Workflow Input Parameters        "
          echo "=========================================="
          echo "install_args:      ${{ github.event.inputs.install_args }}"
          echo "harbor_args:       ${{ github.event.inputs.harbor_args }}"
          echo "model_name:        ${{ github.event.inputs.model_name }}"
          echo "provider:          ${{ github.event.inputs.provider }}"
          echo "effort:            ${{ github.event.inputs.effort }}"
          echo "model_base_url:    ${{ github.event.inputs.model_base_url }}"
          echo "model_temperature: ${{ github.event.inputs.model_temperature }}"
          echo "model_max_tokens:  ${{ github.event.inputs.model_max_tokens }}"
          echo "runs_on:           ${{ github.event.inputs.runs_on }}"
          echo "run_count:         ${{ github.event.inputs.run_count }}"
          echo "=========================================="

      - name: Generate run matrix
        id: set-matrix
        run: |
          COUNT=${{ github.event.inputs.run_count || '1' }}
          # Generate array [1, 2, 3, ..., COUNT]
          MATRIX=$(seq 1 $COUNT | jq -R . | jq -s -c .)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Generated matrix: $MATRIX"

  # Second job: Run Harbor tests (each matrix item is a separate job)
  test-ante-harbor:
    name: Test Ante Harbor (Run ${{ matrix.run_index }})
    needs: generate-matrix
    runs-on: ${{ github.event.inputs.runs_on || 'ubuntu-22.04-16core' }}
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        run_index: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Clean up previous harbor (self-hosted only)
        run: |
          rm -rf $HOME/harbor || true

      - name: Install Docker if not present
        run: |
          if ! command -v docker &> /dev/null; then
            echo "Docker not found, installing..."
            curl -fsSL https://get.docker.com | sudo sh
            sudo usermod -aG docker $USER
            echo "Docker installed successfully"
          else
            echo "Docker already installed"
          fi
          # Ensure current user is in docker group
          if ! groups | grep -q '\bdocker\b'; then
            sudo usermod -aG docker $USER
          fi

      - name: Clone Harbor
        run: |
          cd $HOME
          git clone --depth 1 https://github.com/laude-institute/harbor.git

      - name: Run Harbor tests
        id: run-tests
        env:
          INSTALL_ARGS: ${{ github.event.inputs.install_args }}
          HARBOR_ARGS: ${{ github.event.inputs.harbor_args }}
          MODEL_NAME: ${{ github.event.inputs.model_name }}
          PROVIDER: ${{ github.event.inputs.provider }}
          EFFORT: ${{ github.event.inputs.effort }}
          MODEL_BASE_URL: ${{ github.event.inputs.model_base_url }}
          MODEL_TEMPERATURE: ${{ github.event.inputs.model_temperature }}
          MODEL_MAX_TOKENS: ${{ github.event.inputs.model_max_tokens }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTE_ENV: github_action
        run: |
          cd $HOME/harbor

          echo "=== Run ${{ matrix.run_index }} of ${{ github.event.inputs.run_count }} ==="
          echo "Running harbor with args: $HARBOR_ARGS and model: $MODEL_NAME"

          # Only the selected provider's credential is forwarded into the sandbox.
          case "$PROVIDER" in
            anthropic) CRED=ANTHROPIC_API_KEY ;;
            openai) CRED=OPENAI_API_KEY ;;
            gemini) CRED=GEMINI_API_KEY ;;
            *) echo "Unsupported provider: $PROVIDER" >&2; exit 1 ;;
          esac
          if [ -z "${!CRED}" ]; then
            echo "$CRED is not set for provider $PROVIDER" >&2
            exit 1
          fi

          CMD=(uv run harbor run
            --agent ante_agent:AnteAgent
            --model "$MODEL_NAME"
            --ak "provider=$PROVIDER"
            --ak "install_args=$INSTALL_ARGS")
          if [ -n "$EFFORT" ]; then
            CMD+=(--ak "reasoning_effort=$EFFORT")
          fi
          # ${KEY} is passed literally; harbor expands it when building the sandbox env.
          CMD+=(--ae "$CRED=\${$CRED}")
          for key in MODEL_BASE_URL MODEL_TEMPERATURE MODEL_MAX_TOKENS ANTE_ENV; do
            if [ -n "${!key}" ]; then
              CMD+=(--ae "$key=\${$key}")
            fi
          done
          CMD+=($HARBOR_ARGS)

          # The adapter is imported from the checkout; harbor resolves it via PYTHONPATH.
          export PYTHONPATH="$GITHUB_WORKSPACE/ante-harbor${PYTHONPATH:+:$PYTHONPATH}"

          # Use sg to run with docker group permissions (avoids needing to log out/in)
          sg docker -c "$(printf '%q ' "${CMD[@]}")"

      - name: Collect results
        if: always()
        run: |
          cd $HOME/harbor
          mkdir -p ${{ github.workspace }}/test-results
          cp -r jobs/* ${{ github.workspace }}/test-results/ || true
          cp -r trials/* ${{ github.workspace }}/test-results/ || true

      - name: Upload test results as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ante-harbor-results-${{ github.run_id }}-run-${{ matrix.run_index }}
          path: test-results/
          retention-days: 30
          if-no-files-found: warn
