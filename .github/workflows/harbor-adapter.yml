name: Harbor Adapter

on:
  pull_request:
    paths:
      - 'ante-harbor/**'
      - '.github/workflows/harbor-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'ante-harbor/**'
      - '.github/workflows/harbor-adapter.yml'

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Run unit tests
        run: uv run --no-project python -m unittest discover -s ante-harbor -p 'test_*.py' -v
      - name: Compile adapter modules
        run: uv run --no-project python -m py_compile ante-harbor/ante_agent.py ante-harbor/ante_events.py
