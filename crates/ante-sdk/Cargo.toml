[package]
name = "ante-sdk"
version = "0.2.5"
edition = "2024"
rust-version = "1.88"
description = "Rust SDK for Ante: connect to a host and drive sessions over the Op/Evt protocol"
license = "Apache-2.0"
repository = "https://github.com/AntigmaLabs/ante"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["ws"]
# The `ws://` connector: loopback hosts, no TLS stack.
ws = ["dep:tokio-tungstenite", "dep:futures-util"]
# Opt-in: adds `wss://`. TLS is rustls with the bundled Mozilla roots, so it
# works without a system CA bundle, on a crypto provider the connector picks
# explicitly (aws-lc-rs), so it works whatever else a consumer's dependency
# graph enables on rustls.
wss = ["ws", "tokio-tungstenite/rustls-tls-webpki-roots", "dep:rustls", "dep:webpki-roots"]

[dependencies]
ante-protocol-shape = { version = "=0.2.5", path = "../protocol-shape" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"], optional = true }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync"] }
tokio-tungstenite = { version = "0.30", optional = true }
tracing = "0.1"
webpki-roots = { version = "1", optional = true }
which = "8.0"

[dev-dependencies]
tokio = { version = "1.52", features = ["time"] }
