[package]
name = "ante-exec"
version = "0.3.8"
edition = "2024"
rust-version = "1.88"
description = "Async subprocess runner for agent runtimes: timeouts, bounded output, stdin, Unix process-group cleanup"
authors = ["Antigma Labs, Inc."]
license = "Apache-2.0"
repository = "https://github.com/AntigmaLabs/ante"
homepage = "https://antigma.ai"
documentation = "https://docs.rs/ante-exec"
keywords = ["subprocess", "process", "timeout", "async", "agent-runtime"]
categories = ["asynchronous", "os::unix-apis"]
readme = "README.md"

[dependencies]
anyhow = "1.0"
tokio = { version = "1.0", features = ["process", "sync", "time", "rt", "macros", "io-util", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
pretty_assertions = "1.0"
tempfile = "3.0"
