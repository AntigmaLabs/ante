[package]
name = "ante-llm"
version = "0.3.9"
edition = "2024"
rust-version = "1.88"
description = "OpenAI-compatible provider and model profiles for agent runtimes"
authors = ["Antigma Labs, Inc."]
license = "Apache-2.0"
repository = "https://github.com/AntigmaLabs/ante"
homepage = "https://antigma.ai"
documentation = "https://docs.rs/ante-llm"
keywords = ["llm", "openai", "ai-agent", "agent-runtime"]
categories = ["api-bindings"]
readme = "README.md"

[dependencies]
ante-protocol-shape = { version = "=0.3.9", path = "../protocol-shape" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
