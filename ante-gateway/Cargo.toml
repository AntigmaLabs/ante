[package]
name = "ante-gateway"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Slack and Discord gateway for Ante"
license = "Apache-2.0"
homepage = "https://antigma.ai"
repository = "https://github.com/AntigmaLabs/ante"

[dependencies]
ante-sdk = { version = "0.2", features = ["wss"] }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", default-features = false }
futures-util = { version = "0.3", features = ["sink"] }
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-root-certs = "1"

[dev-dependencies]
tempfile = "3"
